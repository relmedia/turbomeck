# turbomeck.cloud + studio.turbomeck.cloud (Option 2: studio subdomain → admin Next.js :3001)
# Paste into /etc/nginx/sites-available/turbomeck (merge with your setup). maps must be inside http{}.
#
# --- First TLS for studio (cert files missing → nginx -t fails on ssl_certificate) ---
# 1) Comment out the entire "HTTPS studio host" server{} block below (listen 443 … through closing }).
# 2) sudo mkdir -p /var/www/certbot
# 3) Set studio HTTP block root: location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; } (already below).
# 4) sudo nginx -t && sudo systemctl reload nginx
# 5) sudo certbot certonly --webroot -w /var/www/certbot -d studio.turbomeck.cloud
# 6) Uncomment the HTTPS studio server{} block, nginx -t && sudo systemctl reload nginx
# Or: sudo certbot certonly --nginx -d studio.turbomeck.cloud (after step 1 so nginx loads without studio cert).
#
# If webroot returns 404: HTTP requests for studio may hit the port-80 default_server — the "apex HTTP"
# block below includes /.well-known/acme-challenge so the challenge is served. Ensure that block is in your live config.
# Fallback: comment out HTTPS studio, sudo systemctl stop nginx; sudo certbot certonly --standalone -d studio.turbomeck.cloud;
# sudo systemctl start nginx; then uncomment HTTPS studio and reload.
#
# DNS: A/AAAA for studio.turbomeck.cloud → same VPS as storefront.
# Env: apps/admin/.env — AUTH_URL and NEXTAUTH_URL = https://studio.turbomeck.cloud
# NextAuth sign-in page must be / (admin next.config + PM2 set AUTH_SIGNIN_PATH=/); not /studio.
#
# HTTPS listen lines must be IDENTICAL in every server{} on 443 below (same flags on both IPv4/IPv6).
# Do not mix ipv6only=on on one vhost and not another — nginx: "duplicate listen options for [::]:443".
# If you have other files in sites-enabled, use the same listen pair there or only one file owns :443.

map $request_method $api_reviews_root_upstream {
    default http://127.0.0.1:3001;
    POST    http://127.0.0.1:3000;
}

map "$request_method:$http_referer" $api_reviews_id_upstream {
    default http://127.0.0.1:3001;
    "~^PATCH:.*/studio" http://127.0.0.1:3001;
    "~^PATCH:"         http://127.0.0.1:3000;
}

# --- HTTPS studio host (all traffic → admin app :3001) ---
server {
    server_name studio.turbomeck.cloud;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/studio.turbomeck.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.turbomeck.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Tell the browser to use HTTPS only (padlock “secure” after a valid cert).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.turbomeck.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS storefront on apex ---
server {
    server_name turbomeck.cloud www.turbomeck.cloud;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/turbomeck.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turbomeck.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location ^~ /api/product/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/coupons/validate {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reviews/me {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reviews/stats {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /api/reviews {
        proxy_pass $api_reviews_root_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ~ ^/api/reviews/[0-9]+$ {
        proxy_pass $api_reviews_id_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Legacy /studio/... on apex → same path on studio host without /studio prefix
    location = /studio {
        return 301 https://studio.turbomeck.cloud/;
    }

    location = /studio/ {
        return 301 https://studio.turbomeck.cloud/;
    }

    location ~ ^/studio/(.+)$ {
        return 301 https://studio.turbomeck.cloud/$1$is_args$args;
    }

    location ^~ /login {
        return 301 https://studio.turbomeck.cloud$request_uri;
    }

    location /logga-in {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    # NOTE: Do not use "orders" here — GET /api/orders on the shop is the storefront (customer order
    # list for /account). Admin lists orders at /api/orders on studio.turbomeck.cloud only (:3001).
    location ~ ^/api/(dashboard|shipping|coupons|users|cron|settings|best-selling-products|sales-by-location|translate|suggest-description|postnord/track) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}

# HTTP apex (default for unknown Host on :80). ACME here too so studio.turbomeck.cloud challenges work if
# only this vhost catches Host: studio (e.g. minimal merge).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name turbomeck.cloud www.turbomeck.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    if ($host = www.turbomeck.cloud) {
        return 301 https://$host$request_uri;
    }

    if ($host = turbomeck.cloud) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
